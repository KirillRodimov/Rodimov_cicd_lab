name: Python CI

on:
  push:
    branches:
      - main
      - development

  pull_request:
    branches:
      - main
      - development

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Пауза для демонстрации Auto-merge
        if: github.event_name == 'pull_request'
        run: sleep 120

      - name: Запуск unit-тестов
        run: python test_calculator.py